# Creates and updates the labels of the repository from .github/labels.json.
# Labels that are not in the file stay as they are.
name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const label of labels) {
              const wanted = { ...context.repo, name: label.name, color: label.color, description: label.description };
              try {
                const { data } = await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                if (data.color.toLowerCase() !== label.color.toLowerCase() || (data.description || '') !== label.description) {
                  await github.rest.issues.updateLabel(wanted);
                  core.info(`updated: ${label.name}`);
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel(wanted);
                core.info(`created: ${label.name}`);
              }
            }
