# Labels pull requests by the files they change, thanks first-time contributors and
# reminds of the savegame rules when files that store savegames change.
# pull_request_target can label pull requests from forks; the code of the pull
# request is never checked out or run here.
name: Pull request labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const MARK = 'field-health-bot';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const RULES = [
              [/^l10n\//, 'texts'],
              [/^(pallets|hud|brand)\/|^xml\/fillTypes\.xml$/, 'products'],
              [/^scripts\/net\/|^scripts\/core\/FHNetwork\.lua$/, 'multiplayer'],
              [/^scripts\/core\/(FHSavegame|FHFieldMap|FHSettings)\.lua$/, 'savegame'],
              [/^scripts\/gui\//, 'map & HUD'],
              [/^scripts\/core\/FHPrecisionFarming\.lua$/, 'precision farming'],
              [/^scripts\/core\/(FHThreats|FHRisk|FHWeather|FHSimulation|FHCropDamage)\.lua$/, 'threats'],
              [/^(help\/|docs\/|README\.md$)/, 'documentation'],
            ];

            async function commentOnce(key, text) {
              const marker = `<!-- ${MARK}:${key} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (comments.some(comment => (comment.body || '').includes(marker))) {
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${marker}\n${text}` });
              core.info(`comment posted: ${key}`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const wanted = new Set();
            for (const file of files) {
              for (const [pattern, label] of RULES) {
                if (pattern.test(file.filename)) {
                  wanted.add(label);
                }
              }
            }
            const current = new Set((pr.labels || []).map(label => label.name));
            const add = [...wanted].filter(label => !current.has(label));
            if (add.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: add });
              core.info(`labels added: ${add.join(', ')}`);
            }

            if (context.payload.action === 'opened' && ['FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER'].includes(pr.author_association)) {
              await commentOnce('welcome', 'Thanks for your first pull request to Field Health! 🎉 Please fill in the checklist of the description – it helps to review the change quickly.');
            }
            if (wanted.has('savegame')) {
              await commentOnce('savegame', [
                '⚠️ This pull request changes files that decide how savegames are stored.',
                'Players have savegames of every released version, so please check the **Savegame compatibility** list of the description.',
                'Before the next release the change also goes through the full compatibility test against all released versions.',
              ].join('\n'));
            }
